<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Anshumaan Singh</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #07090d; --text: #e8eef5; --muted: #92a1b3; --line: rgba(255,255,255,.15); --accent: #00e5bb; --ink: #03140f; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f7f9; --text: #0c1422; --muted: #4c5a6b; --line: rgba(12,22,36,.17); --accent: #00c49f; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-size: 0.95rem; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.03em; margin: 14px 0 10px; }
  p { color: var(--muted); max-width: 26rem; margin: 0 auto; }
  a { display: inline-block; margin-top: 28px; padding: 12px 20px; border-radius: 11px; background: var(--accent); color: var(--ink); font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <code>$ cd this-page<br>no such file or directory</code>
    <h1>Page not found</h1>
    <p>The link may be old, or the page has moved. Everything I'm working on is on the home page.</p>
    <a href="/">Go to the home page</a>
  </main>
</body>
</html>
